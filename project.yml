name: Pianwai
packages:
  SwiftSoup:
    url: https://github.com/scinfu/SwiftSoup.git
    exactVersion: 2.9.6
options:
  bundleIdPrefix: xyz.fanwai
  deploymentTarget:
    iOS: '27.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    DEVELOPMENT_TEAM: ''
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: 番外
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait
    TARGETED_DEVICE_FAMILY: '1'
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    INFOPLIST_KEY_NSAppleMusicUsageDescription: 从正在播放的歌曲发现关联作品，并在你选择时安排下一首。
    CURRENT_PROJECT_VERSION: 59
    MARKETING_VERSION: 0.5.39
targets:
  Pianwai:
    type: application
    platform: iOS
    info:
      path: Config/Pianwai-Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        BGTaskSchedulerPermittedIdentifiers:
          - $(PRODUCT_BUNDLE_IDENTIFIER).discovery.*
        UIBackgroundModes: [processing]
        NSSupportsLiveActivities: true
        PianwaiInternal: $(PIANWAI_INTERNAL)
        # Only the system's own HTTPS (exempt); saves the export question on every upload.
        ITSAppUsesNonExemptEncryption: false
        # The app is written in Chinese; system controls (PasteButton, share sheets) follow it.
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleLocalizations: [zh-Hans]
    sources:
      - Sources
      - path: Resources
        excludes: ["ShopPlates/**"]
      # Scheme A shop layers (rendered in Design/review/CL1-store-art); kept as a folder so file names stay unique.
      - path: Resources/ShopPlates
        type: folder
        buildPhase: resources
      - path: Design/fixtures/seed-graph.json
        buildPhase: resources
      - path: Design/prompts/story-extract.md
        buildPhase: resources
      - path: Design/prompts/story-write.md
        buildPhase: resources
      - path: Design/prompts/story-pick.md
        buildPhase: resources
    dependencies:
      - package: SwiftSoup
    settings:
      base:
        TARGETED_DEVICE_FAMILY: '1'
        PRODUCT_BUNDLE_IDENTIFIER: xyz.fanwai.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      gatherCoverageData: false
      testTargets: [PianwaiTests]
  PianwaiTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
        excludes: ["**/README.md"]
    dependencies:
      - target: Pianwai
  PianwaiUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
        excludes: [Legacy]
    dependencies:
      - target: Pianwai
    settings:
      base:
        TEST_TARGET_NAME: Pianwai
schemes:
  PianwaiVisualReview:
    build:
      targets:
        Pianwai: all
        PianwaiUITests: [test]
    test:
      targets: [PianwaiUITests]
